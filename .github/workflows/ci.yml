# Continuous integration: secret scan, lint, type-check, test, build and a
# boot smoke test. CI only, nothing is deployed. See CI.md for the reasoning.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels its run still in progress. Runs on main
# are never cancelled, so every commit there gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # Fails if any commit added by this push / PR contains a secret.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history, so the commit range below resolves

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="-1 $SHA" # manual run, or a push whose previous commit is unknown
          fi
          echo "Scanning commits: $range"
          # --redact keeps any secret value out of this public log.
          gitleaks git --log-opts="$range" --redact --verbose .

  # Lists backend/services/* so every service is checked without editing this file.
  discover-services:
    name: Discover backend services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: list
        run: |
          services=$(find backend/services -mindepth 2 -maxdepth 2 -name package.json \
            | xargs -n1 dirname | xargs -n1 basename | sort | jq -R . | jq -cs .)
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Found: $services"

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend (${{ matrix.service }})
    needs: discover-services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one failing service shouldn't hide the others' results
      matrix:
        service: ${{ fromJSON(needs.discover-services.outputs.services) }}
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Same first-time setup as a developer: some API modules read their base
      # URL at import time with no fallback (CI.md K7). Localhost URLs only.
      - name: Use example env
        run: cp .env.example .env
      - run: npm run lint
      - run: npm test
      - name: Build (type-check + bundle)
        run: npm run build

  # Boots every service with the real `npm run dev` and checks each /health.
  smoke:
    name: Smoke test (all services boot)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Placeholders only: the services refuse to boot without these, but /health
    # never reaches Supabase. No real credential is stored in CI.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key # gitleaks:allow
      JWT_SECRET: ci-placeholder-not-a-real-secret # gitleaks:allow
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/services/*/package-lock.json
      - name: Install backend root and every service
        run: |
          npm ci
          for dir in services/*/; do
            echo "::group::npm ci $dir"
            npm ci --prefix "$dir"
            echo "::endgroup::"
          done
      - run: npm run smoke

  # Real build, real backend (all 7 services), real database — the layer
  # that catches contract drift between services unit tests can't, because
  # each side's unit tests mock the other. Unlike `smoke` above, these
  # services need a real database to do anything useful, so this job starts
  # its own throwaway Supabase (built from the migrations and seed) and a
  # RabbitMQ container. No repo secrets. See frontend/e2e/README.md for the suite's own
  # conventions (retries: 0 is deliberate — don't add retries here either).
  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/services/*/package-lock.json
            frontend/package-lock.json

      # A throwaway Supabase for this run only, built from supabase/migrations/
      # and seed.sql. Nothing touches the shared dev database, nothing needs
      # cleaning up afterwards, and a migration that doesn't apply from
      # scratch fails the job here.
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.118.0
      - name: Start a local Supabase
        run: supabase start
      - name: Build the database from migrations and seed
        run: supabase/scripts/build_database.sh "$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"

      - name: Write backend/.env for the local Supabase
        # JWT_SECRET and INTERNAL_SERVICE_SECRET only have to agree between
        # the services in this job, so they're fixed test values, not secrets.
        run: |
          eval "$(supabase status -o env)"
          test -n "$API_URL" && test -n "$SERVICE_ROLE_KEY"
          cat > backend/.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          JWT_SECRET=e2e-only-jwt-secret-not-used-anywhere-else
          INTERNAL_SERVICE_SECRET=e2e-only-internal-secret
          EVENTS_SERVICE_PORT=4001
          USER_SERVICE_PORT=4002
          VENUE_SERVICE_PORT=4003
          NOTIFICATION_SERVICE_PORT=4004
          EQUIPMENT_SERVICE_PORT=4005
          CHAT_SERVICE_PORT=4006
          REGISTRATION_SERVICE_PORT=4007
          EVENTS_SERVICE_URL=http://localhost:4001
          NOTIFICATION_SERVICE_URL=http://localhost:4004
          USER_SERVICE_URL=http://localhost:4002
          VENUE_SERVICE_URL=http://localhost:4003
          EQUIPMENT_SERVICE_URL=http://localhost:4005
          RABBITMQ_URL=amqp://guest:guest@localhost:5672
          EOF
      - name: Use example frontend env
        run: cp frontend/.env.example frontend/.env

      - name: Install backend root and every service
        run: |
          cd backend
          npm ci
          for dir in services/*/; do
            echo "::group::npm ci $dir"
            npm ci --prefix "$dir"
            echo "::endgroup::"
          done
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start all backend services
        working-directory: backend
        # disown so the process survives this step's shell exiting — a
        # background `&` alone isn't guaranteed to outlive it. The job
        # itself cleans this up when the runner VM is torn down; there is
        # no explicit stop step, matching smoke.mjs's own "a dev run is
        # throwaway" stance.
        run: |
          nohup npm run dev > /tmp/backend-dev.log 2>&1 &
          disown
          sleep 2
          jobs -l
      - name: Wait for every service's /health
        run: |
          for port in 4001 4002 4003 4004 4005 4006 4007; do
            echo "waiting for :$port/health"
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:$port/health" > /dev/null; then
                echo ":$port is up"
                break
              fi
              if [ "$i" = 60 ]; then
                echo "::error:::$port never became healthy"
                cat /tmp/backend-dev.log
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run Playwright
        run: npm run e2e
        working-directory: frontend

      - name: Save the backend services' logs
        if: failure()
        run: cp /tmp/backend-dev.log backend-dev.log
      - name: Upload the trace, report and backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-dev.log

  # The single check to require in branch protection. GitHub treats a skipped
  # required check as passing, so requiring e.g. only `smoke` would let a PR
  # merge when a backend job fails (smoke is then skipped, not failed). This job
  # always runs and fails unless every job above succeeded, and it covers new
  # services automatically (they join the `backend` matrix).
  ci-passed:
    name: CI passed
    if: always()
    needs: [secret-scan, discover-services, backend-lint, backend, frontend, smoke, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        # Fails closed: if jq itself errors, the `if !` branch fails the job too.
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::Not every CI job succeeded (see the list above)."
            exit 1
          fi
          echo "All CI jobs succeeded."
